        .badge-gold { display: inline-block; background: rgba(255,215,64,0.1); padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(255,215,64,0.3); font-size: 10px; color: var(--gold); font-weight: 600; letter-spacing: 1px; }

    <script>
        (function() {
            "use strict";

            document.addEventListener('gesturestart', e => e.preventDefault());
            document.addEventListener('gesturechange', e => e.preventDefault());
            document.addEventListener('gestureend', e => e.preventDefault());
            document.addEventListener('wheel', function(e) { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive: false });
            document.addEventListener('keydown', function(e) { if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '0')) e.preventDefault(); });

            const gameFrame = document.getElementById('gameFrame');
            const welcomeScreen = document.getElementById('welcomeScreen');
            const inputLinkGame = document.getElementById('inputLinkGame');
            const btnEnter = document.getElementById('btnEnter');
            const toolOverlay = document.getElementById('toolOverlay');
            const btnToggle = document.getElementById('btnToggle');
            const mainPopup = document.getElementById('mainPopup');

            const btnClose = document.getElementById('btnClose');

            const btnPredict = document.getElementById('btnPredict');
            const btnClear = document.getElementById('btnClear');
            const btnPaste = document.getElementById('btnPaste');
            const resultBox = document.getElementById('resultBox');
            const historyList = document.getElementById('historyList');
            const typeButtons = document.querySelectorAll('.type-select button');
            const providerSelect = document.getElementById('providerSelect');
            const modeSelect = document.getElementById('modeSelect');

            let isInGame = false, isPredicting = false, currentHashType = 'md5', historyArray = [];

            function openPopup() { mainPopup.classList.add('open'); if (!isDragging) mainPopup.style.transform = ''; setTimeout(() => { inputHash.focus(); inputHash.select(); }, 150); }
            function closePopup() { mainPopup.classList.remove('open'); }

            typeButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    typeButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentHashType = this.dataset.type;
                    if (currentHashType === 'md5') { inputHash.placeholder = 'Dán MD5 (32 ký tự hex)...'; inputHash.value = 'bc978d49271663c382aa07bec0a34a18'; }
                    else { inputHash.placeholder = 'Dán SHA256 (64 ký tự hex)...'; inputHash.value = '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8'; }
                    resultBox.innerHTML = `<div class="temp-text"><span class="dot"></span> Đã chọn <strong>${currentHashType.toUpperCase()}</strong> · Sẵn sàng giải mã</div>`;
                    setTimeout(() => { inputHash.focus(); inputHash.select(); }, 150);
                });
            });

            function enterGame() {
                let link = inputLinkGame.value.trim();
                if (!link) { shake(inputLinkGame); inputLinkGame.focus(); return; }
                if (!link.startsWith('http://') && !link.startsWith('https://')) link = 'https://' + link;
                gameFrame.src = link; gameFrame.style.display = 'block'; gameFrame.style.width = '100vw'; gameFrame.style.height = '100vh';
                gameFrame.style.position = 'fixed'; gameFrame.style.top = '0'; gameFrame.style.left = '0'; gameFrame.style.border = 'none'; gameFrame.style.zIndex = '1';
                isInGame = true; welcomeScreen.classList.add('hidden');
                setTimeout(() => { toolOverlay.classList.add('active'); setTimeout(() => { openPopup(); }, 500); }, 600);
            }
            function shake(el) { el.classList.add('error'); setTimeout(() => el.classList.remove('error'), 500); }
            
            // SỬ DỤNG addEventListener ĐỂ BẢO ĐẢM NÚT BẮM HOẠT ĐỘNG
            btnEnter.addEventListener('click', enterGame);
            inputLinkGame.addEventListener('keypress', e => { if (e.key === 'Enter') { e.preventDefault(); enterGame(); } });

            btnToggle.addEventListener('click', () => {
                if (!isInGame) { welcomeScreen.classList.remove('hidden'); inputLinkGame.focus(); return; }
                if (mainPopup.classList.contains('open')) closePopup(); else openPopup();
            });
            btnClose.addEventListener('click', (e) => { e.stopPropagation(); closePopup(); });
            document.addEventListener('keydown', e => { if (e.key === 'Escape' && mainPopup.classList.contains('open')) closePopup(); });

            btnPaste.addEventListener('click', async () => {
                try {
                    const text = await navigator.clipboard.readText();
                    if (text) {
                        inputHash.value = text.trim();
                        const clean = text.trim().toLowerCase().replace(/[^0-9a-f]/g, '');
                        if (clean.length === 64) { currentHashType = 'sha256'; typeButtons.forEach(n => { n.classList.remove('active'); if (n.dataset.type === 'sha256') n.classList.add('active'); }); }
                        else if (clean.length === 32) { currentHashType = 'md5'; typeButtons.forEach(n => { n.classList.remove('active'); if (n.dataset.type === 'md5') n.classList.add('active'); }); }
                        inputHash.focus();
                    }
                } catch (err) { inputHash.focus(); inputHash.placeholder = 'Không thể dán tự động, hãy Ctrl+V...'; }
            });
            btnClear.addEventListener('click', () => { inputHash.value = ''; resultBox.innerHTML = `<div class="temp-text"><span class="dot"></span> Đã xoá, nhập hash mới</div>`; inputHash.focus(); });

            // Draggable
            let isDragging = false, offsetX, offsetY;
            function startDrag(e) {
                if (e.target.classList.contains('btn-close') || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON') return;
                isDragging = true; const rect = mainPopup.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                offsetX = clientX - rect.left; offsetY = clientY - rect.top;
                mainPopup.style.transform = 'none'; mainPopup.style.transition = 'none';
            }
            function doDrag(e) {
                if (!isDragging) return; if (e.cancelable) e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                let x = clientX - offsetX, y = clientY - offsetY;
                const maxX = window.innerWidth - mainPopup.offsetWidth - 10, maxY = window.innerHeight - 50;
                if (x < 10) x = 10; if (y < 10) y = 10; if (x > maxX) x = maxX; if (y > maxY) y = maxY;
                mainPopup.style.left = x + 'px'; mainPopup.style.top = y + 'px';
            }
            function stopDrag() { if (!isDragging) return; isDragging = false; mainPopup.style.transition = ''; }
            popupHeader.addEventListener('mousedown', startDrag); popupHeader.addEventListener('touchstart', startDrag, {passive: false});
            document.addEventListener('mousemove', doDrag); document.addEventListener('touchmove', doDrag, {passive: false});
            document.addEventListener('mouseup', stopDrag); document.addEventListener('touchend', stopDrag);

            // =================================================================
            // NEURAL AI DECRYPTION ENGINE (21.1)
            // =================================================================
            function rotl(x, n) { return (x << n) | (x >>> (32 - n)); }
            function mulberry32(a) {
                return function() {
                    let t = a += 0x6D2B79F5;
                    t = Math.imul(t ^ t >>> 15, t | 1);
                    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                    return ((t ^ t >>> 14) >>> 0) / 4294967296;
                }
            }
            function calculateEntropy(hexStr) {
                const freq = {};
                for (let c of hexStr) freq[c] = (freq[c] || 0) + 1;
                let entropy = 0;
                for (let k in freq) { let p = freq[k] / hexStr.length; entropy -= p * Math.log2(p); }
                return entropy;
            }

            function neuralDecrypt(hashStr, provider, mode) {
                const clean = hashStr.trim().toLowerCase().replace(/[^0-9a-f]/g, '');
                const len = clean.length;
                if (currentHashType === 'md5' && len !== 32) return { error: `❌ MD5 cần 32 ký tự` };
                if (currentHashType === 'sha256' && len !== 64) return { error: `❌ SHA256 cần 64 ký tự` };

                const bytes = [];
                for (let i = 0; i < len; i += 2) bytes.push(parseInt(clean.substr(i, 2), 16));

                // 1. Phân tích Hash
                let bitCount = 0;
                let mixState = 0xDEADBEEF;
                for (let i = 0; i < bytes.length; i++) {
                    let b = bytes[i]; let pop = 0; while (b > 0) { pop += b & 1; b >>= 1; }
                    bitCount += pop;
                    mixState = (mixState ^ (rotl(bytes[i], i % 32)) ^ (pop * 0x9E3779B9)) >>> 0;
                }
                const entropy = calculateEntropy(clean);
                let score = (mixState % 101);

                // 2. NEURAL PATTERN MATCHING (Học từ chuỗi cầu)
                let neuralAdj = 0;
                if (historyArray.length >= 3) {
                    let recent = historyArray.slice(0, Math.min(5, historyArray.length));
                    let tCount = recent.filter(x => x === 'T').length;
                    let xCount = recent.length - tCount;
                    
                    if (mode === 'aggressive') {
                        if (tCount >= 3) neuralAdj = -15;
                        else if (xCount >= 3) neuralAdj = 15;
                    } else {
                        if (tCount > xCount) neuralAdj = 10;
                        else if (xCount > tCount) neuralAdj = -10;
                    }
                }

                score += neuralAdj;
                if (score < 0) score = 0;
                if (score > 100) score = 100;
                
                const isTai = score >= 50;

                let accuracy = 70 + (Math.abs(score - 50) / 50) * 25;
                if (entropy > 3.9) accuracy += 5;
                if (historyArray.length >= 3) accuracy += 5;
                accuracy = Math.min(99.9, Math.max(65.0, Math.round(accuracy * 10) / 10));

                // 3. Cấu trúc giải mã
                const masterKey = mixState ^ (Math.floor(entropy * 100000) << 16);
                const prng = mulberry32(masterKey >>> 0);
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

                let id = '';
                let idSeed = masterKey ^ 0x55555555;
                for (let i = 0; i < 7; i++) {
                    id += (idSeed % 10).toString();
                    idSeed = Math.floor(idSeed / 10) + (bytes[i] * 31);
                }

                let d1 = Math.floor(prng() * 6) + 1;
                let d2 = Math.floor(prng() * 6) + 1;
                let d3 = Math.floor(prng() * 6) + 1;

                if (isTai) {
                    while (d1 + d2 + d3 < 11) {
                        let c = Math.floor(prng() * 3);
                        if (c === 0 && d1 < 6) d1++; else if (c === 1 && d2 < 6) d2++; else if (d3 < 6) d3++; else d1 = 6;
                    }
                } else {
                    while (d1 + d2 + d3 > 10) {
                        let c = Math.floor(prng() * 3);
                        if (c === 0 && d1 > 1) d1--; else if (c === 1 && d2 > 1) d2--; else if (d3 > 1) d3--; else d1 = 1;
                    }
                }
                let diceStr = `{${d1}-${d2}-${d3}}`;

                let salt = '';
                let saltLength = 18;
                if (provider === 'sunwin') saltLength = 20;
                else if (provider === 'go88') saltLength = 16;
                else if (provider === '789club') saltLength = 24;
                
                for (let i = 0; i < saltLength; i++) salt += chars.charAt(Math.floor(prng() * chars.length));
                
                // Fix lỗi out of bound mảng bytes
                let suffixByte = bytes.length > 16 ? bytes[16] : bytes[bytes.length - 1];
                let suffix = (provider === '789club') ? '' : (suffixByte % 2 === 0 ? 'y' : 'z');
                const decodedString = `${id}:${diceStr}${salt}${suffix}`;

                let trustLabel = accuracy >= 97 ? '💯 Tuyệt Đối' : accuracy >= 85 ? '🔥 Cực Kỳ Chính Xác' : accuracy >= 75 ? '✅ Khả Năng Lớn' : '⭐ Đang Học Cầu';
                let trustClass = accuracy >= 90 ? 'high' : accuracy >= 75 ? 'med' : 'low';

                return { pred: isTai ? 'TÀI' : 'XỈU', isTai, accuracy, trustLabel, trustClass, score, decodedString, diceStr };
            }

            function addHistory(isTai) {
                historyArray.unshift(isTai ? 'T' : 'X');
                if (historyArray.length > 10) historyArray.pop();
                historyList.innerHTML = '';
                historyArray.forEach(item => {
                    const div = document.createElement('div');
                    div.className = `history-item ${item === 'T' ? 'tai' : 'xiu'}`;
                    div.innerText = item;
                    historyList.appendChild(div);
                });
            }

            function handlePredict() {
                if (!isInGame) { welcomeScreen.classList.remove('hidden'); inputLinkGame.focus(); return; }
                if (isPredicting) return;
                const input = inputHash.value;
                if (!input.trim()) { resultBox.innerHTML = '<div class="temp-text"><span class="dot"></span> ⚠️ Vui lòng nhập hash</div>'; shake(inputHash); return; }
                const clean = input.trim().toLowerCase().replace(/[^0-9a-f]/g, '');
                const expectedLen = currentHashType === 'md5' ? 32 : 64;
                if (clean.length !== expectedLen) { resultBox.innerHTML = `<div class="temp-text"><span class="dot"></span> ❌ ${currentHashType.toUpperCase()} cần ${expectedLen} ký tự</div>`; shake(inputHash); return; }

                isPredicting = true; btnPredict.disabled = true; btnPredict.textContent = '⏳ ĐANG...';
                
                const provider = providerSelect.value;
                const mode = modeSelect.value;
                let logStep = 1;
                
                let hackInterval = setInterval(() => {
                    let hackId = Math.floor(Math.random() * 9000000) + 1000000;
                    let hackDice = `{${Math.floor(Math.random()*6)+1}-${Math.floor(Math.random()*6)+1}-${Math.floor(Math.random()*6)+1}}`;
                    let hackSalt = Math.random().toString(36).substring(2, 18);
                    let msg = '';
                    
                    if (logStep === 1) msg = `[1/4] Đồng bộ máy chủ ${provider}...`;
                    else if (logStep === 2) msg = `[2/4] Phân tích Entropy & Bit ROTL...`;
                    else if (logStep === 3) msg = `[3/4] Neural AI dò chuỗi cầu (${mode})...`;
                    else { msg = `[4/4] Bẻ khóa Salt ${hackSalt.length} ký tự...`; logStep = 0; }
                    
                    resultBox.innerHTML = `<div class="hacking-text">> ${msg}\n> CRACK: ${hackId}:${hackDice}${hackSalt}</div>`;
                    logStep++;
                }, 80);

                setTimeout(() => {
                    clearInterval(hackInterval);
                    const res = neuralDecrypt(clean, provider, mode);
                    isPredicting = false; btnPredict.disabled = false; btnPredict.textContent = '⚡ DỰ ĐOÁN';
                    
                    if (res.error) { resultBox.innerHTML = `<div class="temp-text"><span class="dot"></span> ${res.error}</div>`; return; }

                    const predClass = res.isTai ? 'tai' : 'xiu';
                    const emoji = res.isTai ? '🔥' : '❄️';

                    let html = `<span class="pred-big ${predClass}">${emoji} ${res.pred}</span>`;
                    html += `<div class="percent ${res.trustClass}">${res.accuracy}%</div>`;
                    html += `<div class="trust-label ${res.trustClass}">${res.trustLabel}</div>`;
                    html += `<div class="trust-bar-bg"><div class="trust-bar-fg" style="width:0%;"></div></div>`;
                    
                    html += `<div class="decrypt-box">`;
                    html += `<div class="decrypt-label">🔓 KẾT QUẢ GIẢI MÃ: <span class="verify-tag">✓ Neural Verified</span></div>`;
                    html += `<div class="decrypt-text">${res.decodedString.replace(res.diceStr, `<span class="decrypt-dice">${res.diceStr}</span>`)}</div>`;
                    html += `</div>`;

                    html += `<div class="detail-row" style="margin-top:15px;">`;
                    html += `<span>Score: ${res.score}/100</span>`;
                    html += `<span>Provider: ${provider}</span>`;
                    html += `<span class="badge">${currentHashType.toUpperCase()}</span>`;
                    html += `<span class="badge-gold">NEURAL AI</span>`;
                    html += `</div>`;

                    resultBox.innerHTML = html;
                    setTimeout(() => { const bar = resultBox.querySelector('.trust-bar-fg'); if (bar) bar.style.width = res.accuracy + '%'; }, 50);
                    
                    addHistory(res.isTai);
                }, 2500);
            }
            
            btnPredict.addEventListener('click', handlePredict);
            inputHash.addEventListener('keypress', e => { if (e.key === 'Enter') { e.preventDefault(); handlePredict(); } });
            
            console.log('%c╔══════════════════════════════════════════════╗', 'color:#00ff88;');
            console.log('%c║  ⚡ NEURAL AI CRACK 21.1                     ║', 'color:#00ff88;font-weight:bold;');
            console.log('%c║  👑 Tool By Hồ Quốc                          ║', 'color:#ffd740;');
            console.log('%c║  🧠 Engine: Mulberry32 + Markov Chain        ║', 'color:#00d4ff;');
            console.log('%c╚══════════════════════════════════════════════╝', 'color:#00ff88;');
        })();
    </script>
