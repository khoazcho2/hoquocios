<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TX HYBRID 23.2 - Direct API</title>
    <style>
        :root {
            --bg: #050a10; --bg2: #0c1520; --bg3: #111b28;
            --accent: #00ff88; --accent2: #00d4ff; --gold: #ffd740;
            --red: #ff5566; --text: #e8f0f8; --text2: #7a8fa0; --text3: #4a6070;
            --border: #1a2d3d; --border2: #243545;
            --shadow-lg: 0 30px 80px rgba(0,0,0,0.95);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text); -webkit-user-select: none; user-select: none;
        }
        #gameFrame { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; border: none; z-index: 1; }
        
        /* Loading & Welcome */
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,10,16,0.98); z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease, visibility 0.5s ease; }
        #loadingOverlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .loader { width: 70px; height: 70px; border: 5px solid var(--border); border-top: 5px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 25px; box-shadow: 0 0 30px rgba(0,255,136,0.3); }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: var(--accent); font-weight: 800; letter-spacing: 3px; font-size: 18px; animation: pulse-text 1.5s infinite; }
        @keyframes pulse-text { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        #welcomeScreen { position: fixed; z-index: 1000; background: rgba(5,10,16,0.98); display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
        #welcomeScreen.fade-out { opacity: 0; transform: scale(1.05); pointer-events: none; }
        .welcome-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 24px; padding: 40px; width: 500px; max-width: 90vw; text-align: center; box-shadow: var(--shadow-lg), 0 0 50px rgba(0,255,136,0.1); position: relative; overflow: hidden; }
        .welcome-box::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(from 0deg, transparent, rgba(0,255,136,0.05), transparent, rgba(0,212,255,0.05), transparent); animation: rotate 12s linear infinite; pointer-events: none; }
        @keyframes rotate { to { transform: rotate(360deg); } }
        .welcome-box::after { content: ''; position: absolute; inset: 2px; background: var(--bg2); border-radius: 22px; z-index: 1; pointer-events: none; }
        .welcome-content { position: relative; z-index: 2; }
        .icon { font-size: 60px; margin-bottom: 12px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        .tool-name { font-size: 30px; font-weight: 900; color: var(--accent); letter-spacing: 2px; margin-bottom: 10px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { font-size: 12px; color: var(--text2); margin-bottom: 8px; display: block; }
        .input-group input { width: 100%; padding: 14px; background: #080f18; border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 14px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0,255,136,0.1); }
        .btn-enter { width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; background: linear-gradient(135deg, #00ff88, #00d4ff); color: #000; transition: all 0.3s; letter-spacing: 1px; }
        .btn-enter:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,255,136,0.3); }

        /* Tool Overlay */
        #toolOverlay { position: fixed; z-index: 998; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
        #toolOverlay.active { opacity: 1; pointer-events: auto; }
        .btn-toggle { position: fixed; top: 20px; left: 20px; z-index: 1001; background: rgba(12,21,32,0.9); border: 1px solid var(--accent); padding: 12px 20px; border-radius: 30px; color: var(--accent); cursor: pointer; font-weight: bold; box-shadow: 0 0 20px rgba(0,255,136,0.2); display: flex; align-items: center; gap: 8px; backdrop-filter: blur(10px); transition: all 0.3s; }
        .btn-toggle:hover { transform: scale(1.05); }
        .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(0,255,136,0.4); } 50% { box-shadow: 0 0 0 8px rgba(0,255,136,0); } }

        .main-popup { position: fixed; top: 80px; left: 20px; width: 400px; max-width: calc(100vw - 40px); background: rgba(12,21,32,0.95); border: 1px solid var(--border); border-radius: 20px; padding: 20px; box-shadow: var(--shadow-lg); max-height: 85vh; overflow-y: auto; transform: scale(0.9) translateY(-10px); opacity: 0; transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1); backdrop-filter: blur(15px); pointer-events: none; }
        .main-popup.open { transform: scale(1) translateY(0); opacity: 1; pointer-events: auto; }
        .popup-header { display: flex; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid var(--border2); padding-bottom: 10px; }
        .popup-header .title { font-size: 16px; font-weight: 800; color: var(--accent2); }
        .btn-close { background: transparent; border: none; color: var(--text2); font-size: 20px; cursor: pointer; }
        
        .dual-section { display: flex; gap: 10px; margin-bottom: 15px; }
        .col-box { flex: 1; background: #0a121d; padding: 12px; border-radius: 12px; border: 1px solid var(--border2); }
        .col-title { font-size: 12px; color: var(--accent2); margin-bottom: 8px; font-weight: bold; text-align: center; }
        .input-sm { width: 100%; padding: 8px; background: #050a10; border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 11px; margin-bottom: 8px; outline: none; font-family: monospace; }
        .btn-sm { width: 100%; padding: 8px; background: var(--accent2); color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; transition: 0.3s; }
        .btn-sm:hover { filter: brightness(1.1); }
        .btn-sm.green { background: var(--accent); }

        .terminal-box { font-family: 'Consolas', monospace; font-size: 11px; color: var(--text2); background: #050a10; padding: 10px; border-radius: 8px; border: 1px dashed var(--border2); line-height: 1.6; margin-top: 10px; white-space: pre-wrap; max-height: 180px; overflow-y: auto; }
        .terminal-box .hl-gold { color: var(--gold); }
        .terminal-box .hl-red { color: var(--red); }
        .terminal-box .hl-green { color: var(--accent); }

        .history-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; margin: 10px 0; }
        .h-cell { aspect-ratio: 1; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; color: #000;}
        .h-cell.T { background: var(--gold); }
        .h-cell.X { background: var(--accent2); }

        .final-pred { text-align: center; background: linear-gradient(135deg, #0a1525, #0f1c2e); padding: 20px; border-radius: 16px; border: 1px solid var(--accent); box-shadow: 0 0 30px rgba(0,255,136,0.1); }
        .final-label { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 2px; }
        .final-result { font-size: 48px; font-weight: 900; margin: 10px 0; }
        .final-result.T { color: var(--gold); text-shadow: 0 0 25px rgba(255,215,64,0.6); }
        .final-result.X { color: var(--accent2); text-shadow: 0 0 25px rgba(0,212,255,0.6); }
        .final-percent { font-size: 24px; font-weight: bold; color: var(--text); margin-bottom: 10px; }
        .progress-bg { width: 100%; height: 8px; background: #1a2838; border-radius: 10px; overflow: hidden; margin-top: 5px; }
        .progress-fg { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent), var(--gold)); border-radius: 10px; transition: width 0.8s ease; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: bold; margin-top: 5px; }
        .badge.t { background: rgba(255,215,64,0.1); color: var(--gold); border: 1px solid rgba(255,215,64,0.3); }
        .badge.x { background: rgba(0,212,255,0.1); color: var(--accent2); border: 1px solid rgba(0,212,255,0.3); }
        
        .auto-section { margin-top: 15px; display: flex; gap: 10px; }
        .btn-auto { flex: 1; padding: 10px; background: #1a2838; color: var(--text); border: 1px solid var(--border2); border-radius: 8px; cursor: pointer; font-size: 12px; transition: 0.3s; }
        .btn-auto.active { background: var(--red); color: #fff; border-color: var(--red); }
    </style>
</head>
<body>

    <iframe id="gameFrame"></iframe>

    <div id="loadingOverlay" class="hidden">
        <div class="loader"></div>
        <div class="loading-text">ĐANG TẢI HYBRID ENGINE...</div>
    </div>

    <div id="welcomeScreen">
        <div class="welcome-box">
            <div class="welcome-content">
                <div class="icon">⚡</div>
                <div class="tool-name">HYBRID ENGINE 23.2</div>
                <div style="font-size: 12px; color: var(--text3); margin-bottom: 20px;">Kết hợp Giải mã MD5 & Đọc Cầu API</div>
                <div class="input-group">
                    <label>🔗 Link Game</label>
                    <input type="text" id="inputLinkGame" value="https://lc79.bet">
                </div>
                <button class="btn-enter" id="btnEnter">🚀 VÀO GAME</button>
            </div>
        </div>
    </div>

    <div id="toolOverlay">
        <button class="btn-toggle" id="btnToggle">
            <span class="live-dot"></span> BẬT TOOL
        </button>
        <div class="main-popup" id="mainPopup">
            <div class="popup-header">
                <span class="title">⚙️ HYBRID PREDICTION</span>
                <button class="btn-close" id="btnClose">✕</button>
            </div>

            <div class="dual-section">
                <div class="col-box">
                    <div class="col-title">🔑 PHÂN TÍCH MD5</div>
                    <input type="text" id="md5Input" class="input-sm" placeholder="Dán mã MD5 (32 ký tự)">
                    <button class="btn-sm green" id="btnMd5">PHÂN TÍCH HASH</button>
                    <div class="terminal-box" id="md5Terminal">> Chờ nhập MD5...</div>
                </div>

                <div class="col-box">
                    <div class="col-title">📡 ĐỌC CẦU API</div>
                    <input type="text" id="apiInput" class="input-sm" value="http://36.50.135.116:5000/api/txmd5">
                    <button class="btn-sm" id="btnApi">KẾT NỐI CẦU</button>
                    <div class="terminal-box" id="apiTerminal">> Chờ kết nối API...</div>
                </div>
            </div>

            <div style="font-size:11px; color:var(--text2); margin-bottom:5px;">LỊCH SỬ 20 PHIÊN (Cũ → Mới):</div>
            <div class="history-grid" id="historyGrid"></div>

            <div class="final-pred">
                <div class="final-label">TỔNG HỢP DỰ ĐOÁN</div>
                <div class="final-result" id="finalRes">...</div>
                <div class="final-percent" id="finalPct">0%</div>
                <div class="progress-bg"><div class="progress-fg" id="finalBar" style="width:0%"></div></div>
                <div style="margin-top:10px; display:flex; justify-content:center; gap:5px; flex-wrap:wrap;">
                    <span class="badge t" id="badgeT" style="display:none;">TÀI</span>
                    <span class="badge x" id="badgeX" style="display:none;">XỈU</span>
                    <span class="badge" style="background:rgba(122,143,160,0.1); color:var(--text2); border:1px solid var(--border2);" id="badgePattern">CHƯA XÁC ĐỊNH</span>
                </div>
            </div>
            
            <div class="auto-section">
                <button class="btn-auto" id="btnAutoTrack">⚡ TỰ ĐỘNG CẬP NHẬT API (15s)</button>
            </div>
        </div>
    </div>

    <script>
        const welcomeScreen = document.getElementById('welcomeScreen');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const inputLinkGame = document.getElementById('inputLinkGame');
        const btnEnter = document.getElementById('btnEnter');
        const gameFrame = document.getElementById('gameFrame');
        const toolOverlay = document.getElementById('toolOverlay');
        const btnToggle = document.getElementById('btnToggle');
        const mainPopup = document.getElementById('mainPopup');
        const btnClose = document.getElementById('btnClose');
        const historyGrid = document.getElementById('historyGrid');
        
        const md5Input = document.getElementById('md5Input');
        const btnMd5 = document.getElementById('btnMd5');
        const md5Terminal = document.getElementById('md5Terminal');
        
        const apiInput = document.getElementById('apiInput');
        const btnApi = document.getElementById('btnApi');
        const apiTerminal = document.getElementById('apiTerminal');
        const btnAutoTrack = document.getElementById('btnAutoTrack');

        const finalRes = document.getElementById('finalRes');
        const finalPct = document.getElementById('finalPct');
        const finalBar = document.getElementById('finalBar');
        const badgeT = document.getElementById('badgeT');
        const badgeX = document.getElementById('badgeX');
        const badgePattern = document.getElementById('badgePattern');

        let md5Vote = null; 
        let apiVote = null;
        let apiConfidence = 0;
        let historyData = [];
        let isAutoTracking = false;
        let trackingInterval = null;

        btnEnter.addEventListener('click', () => {
            let link = inputLinkGame.value.trim();
            if (!link.startsWith('http')) link = 'https://' + link;
            welcomeScreen.classList.add('fade-out');
            loadingOverlay.classList.remove('hidden');
            gameFrame.src = link;
            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
                toolOverlay.classList.add('active');
            }, 2000);
        });

        btnToggle.addEventListener('click', () => mainPopup.classList.toggle('open'));
        btnClose.addEventListener('click', () => mainPopup.classList.remove('open'));

        // 1. THUẬT TOÁN MD5
        function analyzeMD5(hashStr) {
            const clean = hashStr.trim().toLowerCase().replace(/[^0-9a-f]/g, '');
            if (clean.length !== 32 && clean.length !== 64) {
                md5Terminal.innerHTML = '<span class="hl-red">> Lỗi: Hash cần 32 hoặc 64 ký tự!</span>';
                md5Vote = null; synthesize(); return;
            }
            let hexSum = 0, xorVal = 0, bit1Count = 0;
            const bytes = [];
            for (let i = 0; i < clean.length; i += 2) {
                let byte = parseInt(clean.substr(i, 2), 16);
                bytes.push(byte); hexSum += byte; xorVal ^= byte;
                let b = byte; while (b > 0) { bit1Count += b & 1; b >>= 1; }
            }
            let freq = {}; for(let c of clean) freq[c] = (freq[c] || 0) + 1;
            let entropy = 0; for(let key in freq) { let p = freq[key] / clean.length; entropy -= p * Math.log2(p); }

            let votes = [];
            votes.push(hexSum % 2 === 0 ? 'X' : 'T');
            votes.push(bytes[0] > 127 ? 'T' : 'X');
            votes.push(bytes[15] % 2 === 0 ? 'X' : 'T');
            votes.push(xorVal % 2 === 0 ? 'T' : 'X');
            votes.push(bit1Count % 2 === 0 ? 'X' : 'T');
            votes.push(bytes[3] > bytes[4] ? 'T' : 'X');
            votes.push((hexSum + xorVal) % 3 === 0 ? 'T' : 'X');
            votes.push(entropy > 3.5 ? 'T' : 'X');

            let tVotes = votes.filter(v => v === 'T').length;
            let xVotes = votes.filter(v => v === 'X').length;
            md5Vote = tVotes > xVotes ? 'T' : 'X';

            md5Terminal.innerHTML = 
`🔑 <span class="hl-gold">${clean.substr(0,16)}...${clean.substr(-8)}</span>
📊 Tổng hex: <span class="hl-green">${hexSum}</span> → ${hexSum % 2 === 0 ? '🔴 XỈU' : '🔵 TÀI'}
🔢 Ký tự cuối: <span class="hl-green">${clean.substr(-1)}</span>
🔀 XOR: <span class="hl-green">0x${xorVal.toString(16)}</span> | Bit-1: <span class="hl-green">${bit1Count}</span>
📐 Entropy: <span class="hl-green">${entropy.toFixed(3)}</span>
🗳 <span class="hl-gold">${tVotes}/8</span> TÀI | <span class="hl-red">${xVotes}/8</span> XỈU`;
            synthesize();
        }
        btnMd5.addEventListener('click', () => analyzeMD5(md5Input.value));

        // 2. THUẬT TOÁN API (Đã map chuẩn theo JSON của user)
        async function fetchAPI() {
            const api = apiInput.value.trim();
            if (!api) { apiTerminal.innerHTML = '<span class="hl-red">> Vui lòng dán link API!</span>'; return; }
            apiTerminal.innerHTML = '> ⏳ Đang gọi API...';

            try {
                // Dùng allorigins để vượt CORS
                const urlWithCache = api + (api.includes('?') ? '&' : '?') + '_t=' + Date.now();
                const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(urlWithCache);
                const res = await fetch(proxyUrl);
                const data = await res.json();

                // Kiểm tra cấu trúc JSON thực tế
                if (data && data.status === "ok" && Array.isArray(data.lich_su)) {
                    // Map TAI/XIU thành T/X
                    historyData = data.lich_su.map(res => res === "TAI" ? 'T' : 'X');
                    
                    // Lấy thêm dữ liệu thực tế từ API
                    const apiPred = data.du_doan === "TAI" ? 'T' : 'X';
                    const apiRate = data.ty_le || 0;
                    const streak = data.streak || 0;
                    const pTai = (data.p_tai * 100).toFixed(1);
                    const pXiu = (data.p_xiu * 100).toFixed(1);
                    const phien = data.phien_hien_tai;
                    
                    processPattern(historyData, apiPred, apiRate, streak, pTai, pXiu, phien);
                } else {
                    apiTerminal.innerHTML = '<span class="hl-red">> Lỗi: Cấu trúc JSON không khớp!</span>';
                }
            } catch (err) {
                apiTerminal.innerHTML = '<span class="hl-red">> Lỗi Proxy/Mạng: ' + err.message + '</span>';
            }
        }

        function processPattern(arr, apiPred, apiRate, streak, pTai, pXiu, phien) {
            // Vẽ lưới (Đảo ngược mảng để hiển thị Cũ -> Mới từ trái sang phải)
            historyGrid.innerHTML = '';
            [...arr].reverse().forEach(item => {
                const div = document.createElement('div');
                div.className = `h-cell ${item}`;
                div.innerText = item;
                historyGrid.appendChild(div);
            });

            // Cầu của tool tính toán
            const h = [...arr]; // Đã là cũ -> mới
            const n = h.length;
            if (n < 4) { apiTerminal.innerHTML = '> Cần thêm dữ liệu...'; return; }

            const l1 = h[n-1], l2 = h[n-2], l3 = h[n-3], l4 = h[n-4];
            let pattern = 'Ngẫu nhiên', conf = 50;

            if (l1 === l2 && l2 === l3) { apiVote = l1; conf = 85; pattern = `Cầu Bệt ${l1 === 'T' ? 'Tài' : 'Xỉu'}`; } 
            else if (l1 !== l2 && l2 !== l3 && l3 !== l4) { apiVote = l2; conf = 80; pattern = 'Cầu 1-1'; } 
            else if (l1 === l2 && l3 === l4 && l1 !== l3) { apiVote = l3; conf = 75; pattern = 'Cầu 2-2'; } 
            else { let tCount = h.slice(-5).filter(x => x === 'T').length; apiVote = tCount >= 3 ? 'T' : 'X'; conf = 60; pattern = 'Xu hướng'; }

            // Nếu API có tỷ lệ cao, ưu tiên theo API
            if(apiRate > 70) {
                apiVote = apiPred;
                conf = Math.max(conf, apiRate);
                pattern = "Đồng thuận API";
            }

            apiConfidence = conf;
            apiTerminal.innerHTML = 
`Phiên hiện tại: <span class="hl-gold">${phien}</span>
📈 Tỷ lệ API: 🔵 T <span class="hl-green">${pTai}%</span> | 🔴 X <span class="hl-red">${pXiu}%</span>
🔥 Chuỗi bệt hiện tại: <span class="hl-gold">${streak}</span> lần
📡 Tín hiệu Tool: <span class="hl-gold">${pattern}</span>
🎯 Cầu đoán: ${apiVote === 'T' ? '🔵 TÀI' : '🔴 XỈU'}`;
            
            synthesize();
        }
        btnApi.addEventListener('click', fetchAPI);

        // Auto Tracking
        btnAutoTrack.addEventListener('click', () => {
            if (isAutoTracking) {
                clearInterval(trackingInterval);
                isAutoTracking = false;
                btnAutoTrack.classList.remove('active');
                btnAutoTrack.innerText = '⚡ TỰ ĐỘNG CẬP NHẬT API (15s)';
            } else {
                fetchAPI();
                trackingInterval = setInterval(fetchAPI, 15000);
                isAutoTracking = true;
                btnAutoTrack.classList.add('active');
                btnAutoTrack.innerText = '⏸️ ĐANG AUTO (15s)';
            }
        });

        // 3. TỔNG HỢP
        function synthesize() {
            if (!md5Vote && !apiVote) return;
            let finalVote = null, finalConf = 0, text = 'CHỜ DỮ LIỆU';
            if (md5Vote && apiVote) {
                if (md5Vote === apiVote) { finalVote = apiVote; finalConf = Math.min(99, apiConfidence + 15); text = 'MD5 & CẦU ĐỒNG THUẬN'; } 
                else { finalVote = apiVote; finalConf = apiConfidence - 10; text = 'CẦU THỰC TẾ CHỦ ĐẠO'; }
            } else if (apiVote) { finalVote = apiVote; finalConf = apiConfidence - 5; text = 'DỰA TRÊN CẦU API'; } 
            else if (md5Vote) { finalVote = md5Vote; finalConf = 55; text = 'DỰA TRÊN MD5 (YẾU)'; }

            finalRes.className = `final-result ${finalVote}`;
            finalRes.innerText = finalVote === 'T' ? '🔥 TÀI' : '❄️ XỈU';
            finalPct.innerText = finalConf + '%';
            finalBar.style.width = finalConf + '%';
            badgeT.style.display = finalVote === 'T' ? 'inline-block' : 'none';
            badgeX.style.display = finalVote === 'X' ? 'inline-block' : 'none';
            badgePattern.innerText = text;
        }
    </script>
</body>
</html>
