name: Build Unsigned IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned .app
        run: |
          xcodebuild -project FreeFireMaxProxyUI/FreeFireMaxProxyUI.xcodeproj \
            -scheme FreeFireMaxProxyUI \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Locate and package IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "FreeFireMaxProxyUI.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r FreeFireMaxProxyUI.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: FreeFireMaxProxyUI.ipa
